<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7f5;--card:#fff;--tx:#1d2b25;--mu:#5d6d66;--pr:#0f7a5a;--prt:#fff;--bd:#d5e0da;--ok:#0f7a5a;--okb:#dff3ea;--no:#b3261e;--nob:#fbe4e2;--wa:#8a5a00;--wab:#fff0cf}

<script>
var T={P:"Sistem Pencernaan",N:"Sistem Pernapasan",R:"Sistem Peredaran Darah",E:"Sistem Ekskresi",H:"Homeostasis & Diabetes Melitus"};
var Q=[
{y:"a",t:"P",q:"Seorang pasien mengalami penyumbatan saluran empedu oleh batu empedu. Setelah makan makanan berlemak, ia mual dan fesesnya pucat serta berminyak. Hati pasien tetap memproduksi empedu, tetapi empedu tidak dapat mengalir ke duodenum.<br>Gangguan pencernaan yang paling tepat menjelaskan kondisi pasien adalah ....",o:["Pati tidak dapat dipecah menjadi maltosa karena amilase pankreas tidak aktif","Protein tidak dapat diubah menjadi pepton karena pepsin tidak diaktifkan","Lemak tidak teremulsi menjadi butiran kecil sehingga kerja lipase menjadi kurang efektif","Glukosa tidak dapat diserap oleh vili karena transpor aktif terhenti total","Air tidak dapat diserap kembali karena gerak peristaltik kolon melambat"],k:2,e:"Empedu bekerja seperti sabun: memecah gumpalan lemak menjadi butiran kecil (emulsifikasi) agar lipase lebih leluasa bekerja. Tanpa empedu di duodenum, lemak lolos ke feses sehingga feses pucat dan berminyak (steatorea). 💡 Warna cokelat feses normal justru berasal dari pigmen empedu!"},
{y:"a",t:"P",q:"Data berikut menunjukkan kondisi kerja dua enzim pencernaan protein.",tb:[["Enzim","Tempat bekerja","pH optimum"],["Pepsin","Lambung","1,5–2,0"],["Tripsin","Usus halus (duodenum)","7,5–8,5"]],q2:"Kimus yang asam dari lambung masuk ke duodenum. Aktivitas pepsin menurun drastis di duodenum, sedangkan tripsin mulai bekerja.<br>Penjelasan yang paling tepat adalah ....",o:["Empedu mengikat molekul pepsin sehingga sisi aktif enzim menjadi tertutup","Sekret pankreas yang bersifat basa menaikkan pH kimus sehingga pepsin tidak lagi aktif","Seluruh protein telah dihidrolisis menjadi asam amino sebelum kimus meninggalkan lambung","Suhu di duodenum lebih rendah daripada suhu lambung sehingga pepsin terhenti","Amilase yang dikeluarkan pankreas menguraikan molekul pepsin menjadi asam amino"],k:1,e:"Enzim punya pH optimum. Natrium bikarbonat dari pankreas menetralkan asam kimus sehingga pH naik, pepsin tidak aktif, dan tripsin mengambil alih. 💡 Pepsin dilepas sebagai pepsinogen (bentuk tidak aktif) agar tidak mencerna dinding lambung sendiri."},
{y:"a",t:"N",q:"Seorang murid penderita asma mengalami serangan setelah terpapar debu. Spirometri menunjukkan volume udara yang dapat dihembuskan paksa dalam satu detik pertama (FEV₁) menurun. Saat serangan, otot polos bronkiolus berkontraksi dan lendir diproduksi berlebihan.<br>Penyebab langsung penurunan FEV₁ tersebut adalah ....",o:["Surfaktan pada alveolus bertambah sehingga alveolus sulit mengembang saat inspirasi","Diafragma tidak dapat berkontraksi sehingga rongga dada tidak dapat membesar","Jumlah eritrosit menurun sehingga pengikatan oksigen oleh hemoglobin berkurang","Rongga pleura terisi udara sehingga salah satu paru-paru mengempis","Hambatan aliran udara pada saluran napas meningkat sehingga udara sulit dikeluarkan"],k:4,e:"Bronkiolus yang menyempit seperti sedotan yang dijepit: udara susah keluar, sehingga FEV₁ turun. Masalahnya ada di saluran napas, bukan di diafragma, pleura, atau darah. 💡 Inhaler pelega bekerja dengan melemaskan otot polos bronkiolus."},
{y:"a",t:"N",q:"Seorang pendaki dari dataran rendah menetap beberapa minggu di pegunungan setinggi 3.500 m dpl, dengan tekanan parsial oksigen yang lebih rendah. Pemeriksaan darah menunjukkan jumlah eritrosit dan kadar hemoglobinnya meningkat dibandingkan sebelum pendakian.<br>Mekanisme yang paling tepat menjelaskan peningkatan tersebut adalah ....",o:["Ginjal meningkatkan sekresi eritropoietin sehingga sumsum tulang merah membentuk lebih banyak eritrosit","Hati menurunkan pembentukan hemoglobin agar kekentalan darah di pembuluh berkurang","Paru-paru menurunkan frekuensi napas agar energi yang digunakan untuk bernapas lebih hemat","Limpa menghancurkan lebih banyak eritrosit agar oksigen yang terikat dapat dilepaskan","Jantung menurunkan curah jantung agar kebutuhan oksigen otot jantung berkurang"],k:0,e:"Kekurangan O₂ (hipoksia) dideteksi ginjal, yang lalu melepas hormon eritropoietin untuk merangsang sumsum tulang membuat eritrosit. Tiga sistem bekerja sama: pernapasan, ekskresi, dan peredaran darah. 💡 Atlet sering berlatih di dataran tinggi untuk memicu efek ini."},
{y:"a",t:"R",q:"Tabel berikut menunjukkan karakteristik tiga jenis pembuluh darah (P, Q, dan R).",tb:[["Pembuluh","Dinding","Katup","Kecepatan aliran","Tekanan darah"],["P","Tebal dan elastis","Tidak ada","Tinggi","Tinggi"],["Q","Selapis sel endotel","Tidak ada","Sangat rendah","Rendah"],["R","Tipis, kurang elastis","Ada","Rendah","Sangat rendah"]],q2:"Pembuluh yang menjadi tempat pertukaran oksigen, karbon dioksida, dan zat nutrisi antara darah dan sel jaringan adalah ....",o:["P, karena dinding yang tebal dan elastis menahan tekanan darah yang tinggi","P, karena kecepatan aliran yang tinggi mempercepat pengiriman oksigen ke jaringan","R, karena katup yang dimilikinya mencegah aliran balik darah ke jaringan","Q, karena dindingnya hanya selapis sel dan aliran darahnya lambat sehingga difusi efektif","R, karena tekanan darahnya sangat rendah sehingga zat dapat bergerak bebas"],k:3,e:"Q adalah kapiler: dinding setipis satu sel dan aliran paling lambat, jadi ada cukup waktu bagi gas dan nutrien untuk berdifusi. P = arteri, R = vena (bukti: ada katup). 💡 Bila semua kapiler tubuh dibentangkan, panjangnya bisa puluhan ribu kilometer."},
{y:"a",t:"R",q:"Seorang wanita (40 tahun) sering sesak napas dan batuk saat beraktivitas. Ekokardiografi menunjukkan stenosis katup mitral (bikuspid), yaitu penyempitan katup antara atrium kiri dan ventrikel kiri.<br>Dampak yang paling mungkin terjadi pada aliran darah adalah ....",o:["Darah terbendung di atrium kanan sehingga tekanan pada vena kava meningkat","Darah dari ventrikel kanan tidak dapat masuk ke arteri pulmonalis","Darah terbendung di atrium kiri dan vena pulmonalis sehingga tekanan kapiler paru meningkat","Darah kaya oksigen bercampur dengan darah miskin oksigen pada kedua atrium","Darah yang dipompa ventrikel kiri ke aorta meningkat secara berlebihan"],k:2,e:"Katup mitral yang sempit menghambat darah dari atrium kiri ke ventrikel kiri, sehingga darah menumpuk mundur ke vena pulmonalis dan paru. Cairan terdorong ke alveolus, itulah sebab sesak dan batuk. 💡 Bunyi “lub-dub” jantung berasal dari menutupnya katup-katup."},
{y:"a",t:"E",q:"Seorang peneliti membandingkan konsentrasi beberapa zat pada plasma, filtrat glomerulus (urin primer), dan urin individu sehat.",tb:[["Zat","Plasma (mg/dL)","Filtrat glomerulus (mg/dL)","Urin (mg/dL)"],["Glukosa","90","90","0"],["Protein","7.000","0","0"],["Urea","26","26","1.800"]],q2:"Kesimpulan yang paling sesuai dengan data tersebut adalah ....",o:["Glukosa tidak ditemukan dalam urin karena ukurannya terlalu besar untuk disaring di glomerulus","Glukosa terfiltrasi di glomerulus, kemudian direabsorpsi seluruhnya sehingga tidak ada dalam urin","Protein terfiltrasi di glomerulus, kemudian direabsorpsi seluruhnya di tubulus kontortus proksimal","Urea tidak mengalami filtrasi sehingga konsentrasi dalam urin hanya berasal dari sekresi tubulus","Konsentrasi urea dalam urin meningkat karena filtrasi urea di glomerulus bertambah"],k:1,e:"Glukosa ada di filtrat (kadar sama dengan plasma) tetapi 0 di urin, berarti seluruhnya direabsorpsi di tubulus. Protein 0 di filtrat karena molekulnya terlalu besar untuk disaring. Urea di urin pekat karena air banyak direabsorpsi. 💡 Protein di urin (proteinuria) bisa jadi tanda filter ginjal bermasalah."},
{y:"a",t:"E",q:"Seorang pasien sirosis hati mengalami kebingungan dan gangguan kesadaran. Kadar amonia darahnya 120 µg/dL (normal sekitar 15–45 µg/dL), sedangkan fungsi filtrasi ginjalnya masih normal.<br>Penyebab utama peningkatan amonia dalam darah pasien adalah ....",o:["Penurunan kemampuan sel hati mengubah amonia menjadi urea","Peningkatan reabsorpsi amonia pada tubulus kontortus proksimal ginjal","Penurunan filtrasi amonia di badan Malpighi akibat kerusakan glomerulus","Peningkatan produksi amonia oleh kelenjar keringat pada kulit","Penurunan pembentukan empedu yang berfungsi mengikat amonia dari darah"],k:0,e:"Amonia hasil pemecahan protein bersifat racun, terutama bagi otak. Hati mengubahnya menjadi urea (siklus ornitin) yang aman diekskresi ginjal. Pada sirosis, langkah ini terganggu sehingga amonia menumpuk. 💡 Hati bisa tumbuh kembali setelah sebagian diangkat, lho."},
{y:"a",t:"H",q:"Dua orang dewasa, X dan Y, menjalani uji toleransi glukosa oral (TTGO) setelah puasa 8 jam dan meminum larutan 75 gram glukosa.",tb:[["Waktu (menit)","0","30","60","120"],["X (mg/dL)","85","140","120","95"],["Y (mg/dL)","140","250","290","260"]],q2:"Simpulan yang paling tepat berdasarkan data tersebut adalah ....",o:["Y memiliki respons homeostasis yang lebih baik karena kadar glukosanya meningkat lebih tinggi setelah minum glukosa","X mengalami resistensi insulin karena kadar glukosanya menurun cepat setelah menit ke-30","Kadar glukosa X tetap tinggi pada menit ke-120 sehingga X berisiko mengalami diabetes","X dan Y memiliki respons homeostasis glukosa yang sama karena keduanya meningkat setelah minum glukosa","Y mengalami gangguan homeostasis glukosa karena kadar glukosanya tidak kembali ke kisaran normal setelah 120 menit"],k:4,e:"Pada X, insulin bekerja baik: glukosa naik lalu kembali normal (umpan balik negatif). Pada Y, glukosa puasa 140 mg/dL (≥126) dan menit ke-120 sebesar 260 mg/dL (≥200) menandakan homeostasis glukosa tidak efektif. 💡 Naik setelah makan itu normal; yang menentukan adalah apakah ia bisa kembali turun."},
{y:"a",t:"H",q:"Pak Hendra (52 tahun) menderita diabetes melitus tipe 2. Kadar glukosa darahnya 320 mg/dL. Ia sering buang air kecil dalam jumlah banyak dan sering haus. Ambang ginjal untuk reabsorpsi glukosa sekitar 180 mg/dL.<br>Penjelasan yang paling tepat untuk keluhan sering buang air kecil adalah ....",o:["Hormon ADH meningkat sehingga reabsorpsi air di duktus pengumpul bertambah banyak","Insulin yang rendah memicu sekresi aldosteron berlebih sehingga natrium dan air dikeluarkan","Dinding tubulus ginjal rusak sehingga seluruh air dari filtrat glomerulus ikut dikeluarkan","Glukosa yang tidak seluruhnya direabsorpsi meningkatkan tekanan osmotik filtrat sehingga air ikut terbawa ke urin","Produksi keringat berkurang sehingga kelebihan cairan tubuh dikeluarkan melalui ginjal"],k:3,e:"Glukosa 320 mg/dL melampaui kapasitas reabsorpsi tubulus, sehingga sebagian tertinggal di filtrat dan “menarik” air secara osmosis. Hasilnya poliuria, lalu dehidrasi memicu rasa haus (polidipsia). 💡 Poliuria, polidipsia, dan polifagia disebut “3P”, gejala klasik diabetes."},
{y:"b",t:"P",q:"Pasien pankreatitis kronis mengalami penurunan produksi enzim pencernaan pankreas. Ia mengeluh perut kembung, berat badan menurun, dan feses berminyak.<br>Pilih <b>semua</b> pernyataan yang benar mengenai dampak kondisi tersebut!",o:["Lemak tidak tercerna sempurna karena lipase pankreas berkurang","Pati yang belum terhidrolisis lebih banyak karena amilase pankreas berkurang","Pepsinogen tidak dapat berubah menjadi pepsin karena enzim pankreas berkurang","Pencernaan protein di usus halus terganggu karena tripsin dan kimotripsin berkurang","Empedu tidak diproduksi sehingga emulsifikasi lemak tidak dapat berlangsung"],k:[0,1,3],e:"Pankreas menyumbang lipase, amilase, dan tripsin/kimotripsin, jadi lemak, pati, dan protein terdampak. Pepsinogen diaktifkan oleh HCl lambung (bukan enzim pankreas), dan empedu dibuat di hati (bukan pankreas). 💡 Pankreas adalah organ “dua profesi”: eksokrin (enzim) dan endokrin (insulin)."},
{y:"b",t:"N",q:"Seorang murid berlari 15 menit sehingga laju metabolisme sel ototnya meningkat dan menghasilkan lebih banyak CO₂.<br>Pilih <b>semua</b> pernyataan yang benar mengenai pengangkutan gas pernapasan dalam darah!",o:["Sebagian besar oksigen diangkut dalam bentuk oksihemoglobin di dalam eritrosit","Sebagian besar oksigen diangkut dalam keadaan terlarut bebas di dalam plasma darah","Sebagian besar karbon dioksida diangkut sebagai ion bikarbonat di dalam plasma","Karbon monoksida berikatan dengan hemoglobin lebih lemah dibandingkan oksigen","Peningkatan CO₂ dan penurunan pH darah membuat hemoglobin lebih mudah melepaskan oksigen ke jaringan"],k:[0,2,4],e:"O₂ hampir seluruhnya terikat hemoglobin, dan CO₂ terutama diangkut sebagai bikarbonat. Efek Bohr: saat otot aktif (CO₂ naik, pH turun), Hb melepas O₂ lebih banyak tepat di tempat yang membutuhkan. CO justru terikat Hb jauh lebih kuat daripada O₂. 💡 Itu sebabnya keracunan gas CO sangat berbahaya."},
{y:"b",t:"R",q:"Seorang pria (50 tahun) memiliki kadar LDL tinggi dalam waktu lama. Pemeriksaan menunjukkan plak aterosklerosis pada arteri koroner dan ia sering nyeri dada saat beraktivitas.<br>Pilih <b>semua</b> pernyataan yang benar terkait kondisi tersebut!",o:["Plak menyempitkan lumen arteri koroner sehingga aliran darah ke otot jantung berkurang","Suplai oksigen otot jantung yang berkurang saat aktivitas dapat menimbulkan nyeri dada","LDL berfungsi membawa kolesterol dari jaringan ke hati untuk dikeluarkan dari tubuh","Dinding arteri menjadi kaku dan menyempit sehingga resistensi aliran darah meningkat","Elastisitas dinding arteri meningkat sehingga tekanan darah cenderung menurun"],k:[0,1,3],e:"Plak menyempitkan dan mengaku-kan arteri, sehingga otot jantung kekurangan O₂ (nyeri dada/angina) dan tekanan darah cenderung naik. Yang mengangkut kolesterol dari jaringan ke hati adalah HDL, bukan LDL. 💡 LDL sering dijuluki kolesterol “jahat”, HDL “baik”."},
{y:"b",t:"H",q:"Setelah makan nasi dan lauk, kadar glukosa darah seorang murid naik. Beberapa jam kemudian, saat belum makan, kadar glukosanya menurun mendekati batas bawah normal.<br>Pilih <b>semua</b> pernyataan yang benar mengenai pengaturan kadar glukosa darahnya!",o:["Insulin dari sel beta pankreas memacu sel menyerap glukosa dan hati menyimpannya sebagai glikogen","Insulin memacu pemecahan glikogen menjadi glukosa di hati agar kadar glukosa meningkat","Glukagon dari sel alfa pankreas memacu pemecahan glikogen di hati saat kadar glukosa menurun","Insulin dan glukagon bekerja searah untuk menurunkan kadar glukosa darah","Penurunan kadar glukosa darah menekan sekresi insulin sebagai bentuk umpan balik negatif"],k:[0,2,4],e:"Insulin (sel beta) menurunkan glukosa; glukagon (sel alfa) menaikkannya, keduanya antagonis seperti rem dan gas. Pemecahan glikogen dipacu glukagon, bukan insulin. Saat glukosa turun, sekresi insulin ikut ditekan: itulah umpan balik negatif. 💡 Homeostasis glukosa bekerja otomatis 24 jam tanpa kita sadari."},
{y:"b",t:"H",q:"Pak Rudi (55 tahun) menderita diabetes melitus tipe 2 selama 10 tahun dan jarang mengontrol gula darah. Kini luka di kakinya sulit sembuh, ia sering tidak merasakan luka kecil di telapak kaki, dan urinnya mengandung protein.<br>Pilih <b>semua</b> penjelasan yang benar mengenai kondisi Pak Rudi!",o:["Hiperglikemia kronis merusak kapiler glomerulus sehingga protein dapat lolos ke dalam urin","Kerusakan pembuluh darah kecil mengurangi aliran darah ke jaringan sehingga luka lambat sembuh","Protein muncul dalam urin karena reabsorpsi protein di tubulus kontortus distal meningkat","Kadar glukosa tinggi menurunkan tekanan osmotik darah sehingga ginjal menahan lebih banyak air","Kerusakan saraf tepi akibat hiperglikemia kronis membuat kaki kurang peka terhadap luka"],k:[0,1,4],e:"Gula darah tinggi menahun merusak pembuluh darah kecil dan saraf: ginjal (nefropati), luka lambat sembuh, dan kaki kebas (neuropati). Protein masuk urin karena filter glomerulus rusak, bukan karena reabsorpsi naik; glukosa tinggi justru menaikkan tekanan osmotik darah. 💡 Karena itu penderita DM dianjurkan memeriksa kaki setiap hari."},
{y:"c",t:"E",q:"Rani mengikuti lari jarak jauh selama satu jam pada siang yang panas dan tidak minum. Ia berkeringat banyak. Setelah lomba, urinnya sedikit dan berwarna kuning pekat.",s:["Kehilangan cairan melalui keringat meningkatkan osmolaritas darah sehingga hipotalamus memicu pelepasan ADH.","ADH meningkatkan permeabilitas tubulus kontortus distal dan duktus pengumpul terhadap air sehingga reabsorpsi air bertambah.","Urin menjadi pekat karena ADH menurunkan reabsorpsi air di duktus pengumpul."],k:[1,1,0],e:"Dehidrasi → osmolaritas darah naik → hipotalamus memicu ADH → reabsorpsi air naik → urin sedikit dan pekat. Pernyataan 3 terbalik: ADH justru meningkatkan reabsorpsi air. 💡 Warna urin adalah “indikator hidrasi” gratis: makin pekat, makin butuh minum."},
{y:"c",t:"N",q:"Pak Doni (45 tahun) merokok selama 25 tahun. Ia sering batuk berdahak dan sesak napas saat menaiki tangga. Rontgen menunjukkan dinding banyak alveolus rusak (emfisema).",s:["Asap rokok merusak silia pada saluran napas sehingga pembersihan lendir dan partikel asing berkurang.","Kerusakan dinding alveolus menurunkan luas permukaan pertukaran gas di paru-paru.","Penurunan luas permukaan alveolus menyebabkan kadar oksigen dalam darah meningkat."],k:[1,1,0],e:"Silia berfungsi sebagai “sapu” saluran napas dan lumpuh akibat asap rokok. Alveolus rusak berarti luas permukaan difusi berkurang, sehingga O₂ yang masuk ke darah justru menurun. 💡 Luas alveolus sehat seluruhnya setara kira-kira separuh lapangan tenis."},
{y:"c",t:"P",q:"Sinta (10 tahun) selalu mengalami perut kembung, banyak gas, dan diare setelah minum susu sapi. Dokter mendiagnosis intoleransi laktosa akibat kekurangan enzim laktase.",s:["Tanpa laktase, laktosa tidak dihidrolisis menjadi glukosa dan galaktosa di usus halus.","Laktosa yang tidak tercerna memasuki usus besar dan difermentasi bakteri sehingga menghasilkan gas.","Diare terjadi karena laktosa dalam lumen usus menurunkan tekanan osmotik sehingga air lebih banyak diserap."],k:[1,1,0],e:"Laktosa yang tak tercerna tidak bisa diserap; di usus besar ia difermentasi bakteri (gas) dan meningkatkan tekanan osmotik lumen sehingga air tertahan dan terjadi diare. Pernyataan 3 keliru karena arahnya terbalik. 💡 Banyak orang dewasa di dunia memang kehilangan sebagian besar aktivitas laktase seiring usia."},
{y:"c",t:"H",q:"Bayu (15 tahun) menderita diabetes melitus tipe 1 dan lupa menyuntik insulin selama dua hari. Ia mual, napas cepat dan dalam, napasnya berbau aseton, dan glukosa darahnya 350 mg/dL. Dokter menyatakan ia mengalami ketoasidosis diabetik.",s:["Tanpa insulin, sel tidak dapat memanfaatkan glukosa sehingga lemak dipecah sebagai sumber energi dan menghasilkan badan keton.","Penumpukan badan keton menurunkan pH darah, dan napas cepat serta dalam membantu membuang CO₂ untuk mengompensasi asidosis.","Glukosa darah tinggi pada Bayu disebabkan sel alfa pankreas yang menghasilkan insulin secara berlebihan."],k:[1,1,0],e:"Sel “lapar” di tengah lautan glukosa, sehingga tubuh membakar lemak dan menghasilkan keton yang bersifat asam. Paru berusaha mengompensasi dengan membuang CO₂ lewat napas dalam (sistem pernapasan membantu menjaga pH). Insulin dibuat sel beta, bukan sel alfa, dan pada DM tipe 1 sel beta rusak oleh autoimun. 💡 Napas berbau aseton adalah ciri khas keton."},
{y:"c",t:"H",q:"Dina (17 tahun), penderita diabetes melitus tipe 1, menyuntik insulin sesuai dosis pada pagi hari tetapi melewatkan makan siang. Menjelang sore ia gemetar, berkeringat dingin, dan jantungnya berdebar. Kadar glukosa darahnya 55 mg/dL.",s:["Kadar glukosa darah turun di bawah normal karena insulin tetap bekerja menurunkan glukosa sementara asupan glukosa tidak ada.","Gemetar dan jantung berdebar dipicu oleh hormon adrenalin dari medula adrenal sebagai respons terhadap penurunan glukosa darah.","Penanganan awal yang tepat adalah menyuntikkan insulin tambahan agar kadar glukosa darah kembali normal."],k:[1,1,0],e:"Ini hipoglikemia: insulin tetap bekerja tanpa asupan glukosa. Tubuh merespons dengan adrenalin (gemetar, berdebar, keringat dingin) sebagai “alarm darurat”. Penanganan awalnya adalah karbohidrat sederhana (misalnya teh manis), bukan insulin tambahan yang justru memperparah. 💡 Karena itu penderita DM dianjurkan selalu membawa gula/permen."}
];
var A=[],cur=0,me={},app=document.getElementById("app");
function $(h){return h}
function init(){A=Q.map(function(q){return q.y=="a"?null:q.y=="b"?[]:[null,null,null]});cur=0}
function el(h){app.innerHTML=h;window.scrollTo(0,0)}
function tbl(t){if(!t)return"";return'<div class="sx"><table>'+t.map(function(r,i){return"<tr>"+r.map(function(c){return(i?"<td>":"<th>")+c+(i?"</td>":"</th>")}).join("")+"</tr>"}).join("")+"</table></div>"}
function start(){init();
el('<div class="card"><h1>🧬 Ulangan Harian Biologi XI</h1><div class="mu">Fase F · TP 6.1 (pencernaan, pernapasan, peredaran darah, ekskresi) &amp; TP 6.4 (homeostasis – diabetes melitus)</div>'+
'<label for="nm">Nama lengkap</label><input id="nm" placeholder="Tulis namamu" autocomplete="off">'+
'<label for="kl">Kelas</label><input id="kl" placeholder="Contoh: XI-3" autocomplete="off">'+
'<p class="mu">20 soal: 10 pilihan ganda, 5 pilihan ganda kompleks (pilih semua yang benar), 5 benar/salah berbasis kasus. Setelah selesai kamu akan melihat nilai, umpan balik, dan pembahasan.</p>'+
'<button class="btn" id="go">Mulai Mengerjakan →</button><p class="mu" id="er" style="color:var(--no)"></p></div>');
document.getElementById("go").onclick=function(){var n=document.getElementById("nm").value.trim(),k=document.getElementById("kl").value.trim();
if(!n||!k){document.getElementById("er").textContent="Isi nama dan kelas dulu ya.";return}me={n:n,k:k};cur=0;show()}}
function answered(i){var a=A[i],q=Q[i];return q.y=="a"?a!==null:q.y=="b"?a.length>0:a.every(function(x){return x!==null})}
function show(){var q=Q[cur],a=A[cur],h="";var done=Q.filter(function(_,i){return answered(i)}).length;
h+='<div class="card"><div class="mu">'+me.n+' · '+me.k+'</div><div class="bar" style="margin-top:8px"><i style="width:'+(done/20*100)+'%"></i></div><div class="mu" style="margin-top:4px">Terjawab '+done+' dari 20</div></div>';
h+='<div class="card"><span class="chip">Soal '+(cur+1)+' · '+(q.y=="a"?"Pilihan ganda":q.y=="b"?"Pilih semua yang benar":"Benar / Salah")+'</span><p>'+q.q+'</p>'+tbl(q.tb)+(q.q2?'<p>'+q.q2+'</p>':'');
if(q.y=="a")h+=q.o.map(function(o,i){return'<button class="opt'+(a===i?" sel":"")+'" data-i="'+i+'"><b>'+"ABCDE"[i]+'.</b><span>'+o+'</span></button>'}).join("");
if(q.y=="b")h+=q.o.map(function(o,i){return'<button class="opt'+(a.indexOf(i)>-1?" sel":"")+'" data-i="'+i+'"><b>'+(a.indexOf(i)>-1?"☑":"☐")+'</b><span>'+o+'</span></button>'}).join("");
if(q.y=="c")h+=q.s.map(function(s,i){return'<div class="sr"><div>'+(i+1)+'. '+s+'</div><div class="tf"><button data-i="'+i+'" data-v="1" class="'+(a[i]===1?"sel":"")+'">Benar</button><button data-i="'+i+'" data-v="0" class="'+(a[i]===0?"sel":"")+'">Salah</button></div></div>'}).join("");
h+='<div class="row"><button class="btn g" id="pv"'+(cur?"":" disabled")+'>← Sebelumnya</button>'+(cur<19?'<button class="btn" id="nx">Berikutnya →</button>':'<button class="btn" id="fn">Selesai &amp; Lihat Nilai ✓</button>')+'</div>';
h+='<div class="dots">'+Q.map(function(_,i){return'<button class="dot'+(answered(i)?" d":"")+(i==cur?" c":"")+'" data-j="'+i+'">'+(i+1)+'</button>'}).join("")+'</div></div>';
el(h);
app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){var i=+b.dataset.i;if(q.y=="a")A[cur]=i;else{var p=A[cur].indexOf(i);p>-1?A[cur].splice(p,1):A[cur].push(i)}show()}});
app.querySelectorAll(".tf button").forEach(function(b){b.onclick=function(){A[cur][+b.dataset.i]=+b.dataset.v;show()}});
app.querySelectorAll(".dot").forEach(function(b){b.onclick=function(){cur=+b.dataset.j;show()}});
var pv=document.getElementById("pv"),nx=document.getElementById("nx"),fn=document.getElementById("fn");
pv.onclick=function(){cur--;show()};if(nx)nx.onclick=function(){cur++;show()};
if(fn)fn.onclick=function(){var u=20-done;if(u&&!confirm("Masih ada "+u+" soal belum terjawab. Tetap selesaikan?"))return;finish()}}
function sc(i){var q=Q[i],a=A[i];if(q.y=="a")return a===q.k?1:0;
if(q.y=="b"){return a.length==q.k.length&&q.k.every(function(x){return a.indexOf(x)>-1})?1:0}
var n=0;q.k.forEach(function(k,j){if(a[j]===k)n++});return n/3}
function finish(){var tot=0,by={};Q.forEach(function(q,i){var s=sc(i);tot+=s;by[q.t]=by[q.t]||[0,0];by[q.t][0]+=s;by[q.t][1]++});
var nil=Math.round(tot/20*100),m,e;
if(nil>=85){m="Luar biasa!";e="🏆"}else if(nil>=70){m="Bagus sekali!";e="🌟"}else if(nil>=55){m="Cukup baik, terus tingkatkan!";e="💪"}else{m="Jangan menyerah, ayo belajar lagi!";e="📚"}
var ks=Object.keys(by),kuat=ks.filter(function(k){return by[k][0]/by[k][1]>=.75}).map(function(k){return T[k]}),lemah=ks.filter(function(k){return by[k][0]/by[k][1]<.6}).map(function(k){return T[k]});
var h='<div class="card" style="text-align:center"><div class="mu">'+me.n+' · '+me.k+'</div><div style="font-size:2.4rem">'+e+'</div><div class="big">'+nil+'</div><h2>'+m+'</h2><div class="mu">Skor '+(Math.round(tot*10)/10)+' dari 20 soal</div></div>';
h+='<div class="card"><h2>Umpan Balik</h2>';
if(kuat.length)h+='<p>✅ <b>Sudah kuat:</b> '+kuat.join(", ")+'.</p>';
if(lemah.length)h+='<p>🔎 <b>Perlu diperkuat:</b> '+lemah.join(", ")+'. Baca pembahasannya, lalu coba jelaskan ulang dengan kata-katamu sendiri.</p>';
if(!lemah.length&&!kuat.length)h+='<p>Kemampuanmu sudah merata. Pertajam lagi dengan membaca pembahasan.</p>';
if(nil>=85)h+='<p>Kamu sudah mampu menghubungkan konsep antar-sistem organ dengan kasus nyata. Tantang dirimu membuat soal kasus sendiri!</p>';
else h+='<p>Tips: soal bentuk TKA menuntut penalaran. Baca kasus, tandai kata kunci (data, gejala), lalu hubungkan dengan konsep struktur dan fungsi organ.</p>';
h+='<h2 style="margin-top:14px">Capaian per Topik</h2>'+ks.map(function(k){var p=Math.round(by[k][0]/by[k][1]*100);return'<div class="st"><div style="min-width:130px;font-size:.88rem">'+T[k]+'</div><div class="bar"><i style="width:'+p+'%"></i></div><span>'+p+'%</span></div>'}).join("")+'</div>';
h+='<div class="card"><button class="btn" id="rv" style="width:100%">📖 Lihat Pembahasan</button><div class="row"><button class="btn g" id="rt">↻ Kerjakan Ulang</button></div></div>';
el(h);document.getElementById("rv").onclick=review;document.getElementById("rt").onclick=start}
function review(){var h='<div class="card"><h1>📖 Pembahasan</h1><div class="mu">'+me.n+' · '+me.k+'. Hijau = jawaban benar, merah = jawabanmu yang kurang tepat.</div><div class="row"><button class="btn g" id="bk">← Kembali ke Nilai</button></div></div>';
Q.forEach(function(q,i){var a=A[i],s=sc(i),b=s==1?'<span class="tag ok">Benar</span>':s>0?'<span class="tag wa">Sebagian benar</span>':'<span class="tag no">Kurang tepat</span>';
h+='<div class="card"><span class="chip">Soal '+(i+1)+' · '+T[q.t]+'</span> '+b+'<p>'+q.q+'</p>'+tbl(q.tb)+(q.q2?'<p>'+q.q2+'</p>':'');
if(q.y=="a")h+=q.o.map(function(o,j){var c=j==q.k?"k":a===j?"x":"";return'<div class="ro '+c+'"><b>'+"ABCDE"[j]+'.</b> '+o+(j==q.k?" ✔":"")+(a===j&&j!=q.k?" ✘ (jawabanmu)":a===j?" (jawabanmu)":"")+'</div>'}).join("");
if(q.y=="b")h+=q.o.map(function(o,j){var kk=q.k.indexOf(j)>-1,pp=a.indexOf(j)>-1,c=kk?"k":pp?"x":"";return'<div class="ro '+c+'"><b>'+"ABCDE"[j]+'.</b> '+o+(kk?" ✔":"")+(pp?(kk?" (kamu pilih)":" ✘ (kamu pilih)"):"")+'</div>'}).join("");
if(q.y=="c")h+=q.s.map(function(x,j){var ok=a[j]===q.k[j];return'<div class="ro '+(ok?"k":"x")+'">'+(j+1)+'. '+x+'<br><b>Kunci: '+(q.k[j]?"Benar":"Salah")+'</b> · Jawabanmu: '+(a[j]===null?"kosong":a[j]?"Benar":"Salah")+(ok?" ✔":" ✘")+'</div>'}).join("");
h+='<div class="ex"><b>Pembahasan:</b> '+q.e+'</div></div>'});
h+='<div class="card"><button class="btn" id="bk2" style="width:100%">← Kembali ke Nilai</button></div>';
el(h);document.getElementById("bk").onclick=document.getElementById("bk2").onclick=finish}
start();
</script></body></html>
